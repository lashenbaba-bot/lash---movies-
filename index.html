<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lash Movies - Watch & Download Free Movies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">.Lash Movies</div>
        <input type="text" id="search" placeholder="චිත්‍රපට සෙවුම...">
    </header>

    <main>
        <h1>නවතම චිත්‍රපට (Latest Movies)</h1>
        
        <div class="movie-grid">
            <div class="movie-card">
                <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
                <h3>Movie Title 1</h3>
                <p>2026 | Action</p>
                <a href="#player" class="btn">නරඹන්න / Download</a>
            </div>

            <div class="movie-card">
                <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
                <h3>Movie Title 2</h3>
                <p>2025 | Sci-Fi</p>
                <a href="#player" class="btn">නරඹන්න / Download</a>
            </div>
        </div>

        <section id="player" class="player-section">
            <h2>චිත්‍රපටය නරඹන්න (Player)</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY" allowfullscreen></iframe>
            </div>
            <br>
            <a href="https://example.com/download-link" class="btn download-btn" target="_blank">Download Movie</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Lash Movies. All Rights Reserved.</p>
    </footer>

</body>
</html>
